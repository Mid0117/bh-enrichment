name: BH Multi-Property Owner Sync

on:
  schedule:
    # 00:00 UTC = 8 PM ET (EDT). During EST it's 7 PM ET — close enough.
    # Sweeps all open deals: flags multi-property owners, posts the
    # 'ALSO OWNS' pinned note, merges LLC-named deals into the matching
    # human-named contact when the same phone is shared.
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run multi-property owner sync
        env:
          AIRCALL_API_ID: ${{ secrets.AIRCALL_API_ID }}
          AIRCALL_API_TOKEN: ${{ secrets.AIRCALL_API_TOKEN }}
          PIPEDRIVE_TOKEN: ${{ secrets.PIPEDRIVE_TOKEN }}
        run: python scripts/multi_property_owner_sync.py
